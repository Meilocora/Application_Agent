[project]
name = "application-agent"
version = "0.1.0"
description = "AI agent that searches German job boards, assesses postings against your CV and writes cover letters."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Meilocora", email = "118931293+Meilocora@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai-agents>=0.24.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.5",
]

[project.scripts]
application-agent = "application_agent:main"
cover-letter = "application_agent:cover_letter_main"
job-status = "application_agent:job_status_main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]

# Shortcuts like npm scripts: `uv run poe <task>`, `uv run poe` lists them all.
[tool.poe.tasks]
test = { cmd = "pytest", help = "Tests - the real API is mocked" }
live = { cmd = "pytest -m live", help = "One test against the real Arbeitsagentur API" }
cov = { cmd = "pytest --cov --cov-report=term-missing --cov-report=html", help = "Tests with coverage, report in htmlcov/index.html" }
lint = { cmd = "ruff check", help = "Lint" }
types = { cmd = "pyright", help = "Type check (the checker behind Pylance)" }
check = { sequence = ["lint", "types", "cov"], help = "Everything CI runs" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# async test functions run without an extra @pytest.mark.asyncio decorator
asyncio_mode = "auto"
markers = ["live: calls the real Arbeitsagentur API - run explicitly with `uv run pytest -m live`"]
# Live tests are skipped by default: they need internet and depend on today's job ads.
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["application_agent"]
# Paths relative to the project, so the coverage file from CI can be read anywhere.
relative_files = true

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: errors and unused or undefined names, I: import order, B: likely bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long lines - mostly comments at the end of a line

[tool.pyright]
# The same checker that runs inside Pylance - so CI reports what VS Code shows.
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
